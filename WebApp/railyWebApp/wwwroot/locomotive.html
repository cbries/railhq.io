<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="description" content="{{ApplicationDescription}}">
    <meta name="author" content="{{Author}}">
    <meta name="application-name" content="{{ApplicationName}}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ApplicationName}}</title>

    <link rel="shortcut icon" href="favicon.ico">

    <link rel="stylesheet" href="libs/roundslider.min.css">
    <link rel="stylesheet" href="./libs/w2ui-1.5.rc1.min.css" type="text/css" />
    <link rel="stylesheet" href="./libs/fas/css/all.min.css" type="text/css" media="screen" />
    <link href="css/mainRemoteControl.css" rel="stylesheet">

    <script type="text/javascript" src="./libs/w2ui-1.5.rc1.js" defer></script>
    <script type="text/javascript" src="./libs/jquery-3.5.1.min.js"></script>
    <script src="libs/roundslider.min.js"></script>
    <script src="libs/tailwind.min.css"></script>

    <!-- Server-side configuration for JavaScript -->
    <script type="text/javascript">
        window.railhqConfig = {
            websiteUrl: "{{CONFIG_WEBSITE_URL}}",
            wikiUrl: "{{CONFIG_WIKI_URL}}"
        };
    </script>

    <script type="text/javascript" src="./src/globals.js" defer></script>
    <script type="text/javascript" src="./src/utilities.js" defer></script>
    <script type="text/javascript" src="./src/errorHandler.js" defer></script>
    <script type="text/javascript" src="./src/events.js" defer></script>
    <script type="text/javascript" src="./src/serverHandling.js" defer></script>
    <script type="text/javascript" src="./src/websocketSync.js" defer></script>
    <script type="text/javascript" src="shared.js" defer></script>
    <script type="text/javascript" src="locomotive.js" defer></script>
</head>

<body class="bg-gray-100 flex flex-col items-center p-4 min-h-screen">

    <!-- Lokbild mit Geschwindigkeit im Bild -->
    <div class="relative w-full max-w-xs overflow-hidden">
        <img class="locomotiveImage w-full h-full object-contain rounded-lg shadow-lg" src="./images/noimage32x32.png" alt="" style="max-height: 100px;">

        <!-- Reservierungs-Indikator -->
        <div class="reservedIndicator absolute top-0 left-0 w-full bg-red-600 bg-opacity-80 text-white text-center text-xs font-bold py-1 hidden"
             style="font-weight: 500; top: 5px; left: 5px; max-width: 20%;">
            <i class="fas fa-thumbtack"></i> 
            <div class="reservedBlockName" style="display: inline-block"> Block ?</div>
        </div>

        <!-- Geschwindigkeit IM Bild -->
        <div id="speedDisplay" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white text-5xl font-bold drop-shadow-lg">
            0
        </div>
    </div>

    <div class="flex items-center space-x-2 mt-1">
        <div class="locname font-semibold text-sm"></div>

        <div class="flex items-center gap-0 text-sm">
            <span>(</span>
            <div class="locdriver bg-gray-100 px-0 py-0 rounded-md shadow-sm"></div>
            <span>::</span>
            <div class="locobjectid bg-gray-100 px-0 py-0 rounded-md shadow-sm"></div>
            <span>, DCC&nbsp;</span>
            <div class="locaddr bg-gray-100 px-0 py-0 rounded-md shadow-sm"></div>
            <span>)</span>
        </div>
    </div>

    <!-- Speed-Level Buttons oben -->
    <div class="flex space-x-4 mt-2">
        <button class="speedLevel0 w-14 h-10 bg-gray-300 text-black rounded-lg shadow-md" data-speedstep="level0"><i class="fa fa-exclamation-triangle"></i></button>
        <button class="speedLevel1 w-14 h-10 bg-gray-300 text-black rounded-lg shadow-md" data-speedstep="levelMinimum">I</button>
        <button class="speedLevel2 w-14 h-10 bg-gray-300 text-black rounded-lg shadow-md" data-speedstep="levelEnter">II</button>
        <button class="speedLevel3 w-14 h-10 bg-gray-300 text-black rounded-lg shadow-md" data-speedstep="levelCruise">III</button>
        <button class="speedLevel4 w-14 h-10 bg-gray-300 text-black rounded-lg shadow-md" data-speedstep="levelMax">IV</button>
    </div>

    <!-- Steuerung und Fahrregler nebeneinander -->
    <div class="mt-2 flex items-center space-x-8 w-full justify-between">
        <!-- Fahrtrichtung (links vom Slider) -->
        <div class="flex flex-col space-y-4 w-1/4">
            <button class="directionBackward p-3 bg-gray-300 rounded-full shadow-md flex items-center justify-center text-2xl" data-direction="backward">
                <i class="fa fa-backward"></i>
            </button>
        </div>

        <div class="flex justify-center items-center w-full mt-2">
            <div id="circularSlider"></div>
        </div>

        <!-- Fahrtrichtung (rechts vom Slider) -->
        <div class="flex flex-col space-y-4 w-1/4">
            <button class="directionForward p-3 bg-gray-300 rounded-full shadow-md flex items-center justify-center text-2xl" data-direction="forward">
                <i class="fa fa-forward"></i>
            </button>
        </div>
    </div>

    <!-- Funktionstaste -->
    <div class="mt-1 w-full max-w-full py-4 px-2">
        <div class="scrollable-container overflow-x-auto">
            <div class="locomotiveCommandField flex space-x-4 min-w-max">
            </div>
        </div>
    </div>

    <!-- Lokomotiven Kacheln mit Scrollbereich -->
    <div class="mt-1 w-full max-w-full py-4 px-2">
        <div class="scrollable-container overflow-x-auto">
            <div class="locCarousell flex space-x-4 min-w-max">
            </div>
        </div>
    </div>

    <!-- Not-Halt und Strom-Aus -->
    <div class="flex space-x-4 mt-8">
        <button class="emergencyStop px-6 py-3 bg-black text-white font-semibold rounded-lg shadow-md text-xs">
            🚨 Emergency Stop
        </button>
        <button class="powerOff px-6 py-3 bg-black text-white font-semibold rounded-lg shadow-md text-xs">
            ⚡ Power Off
        </button>
    </div>

    <div class="footerInfo">
        <span class="serverInfoPing"><span class="value"></span></span>
        <span class="automodeInfo"></span>
    </div>

    <!-- Fehlermeldungs-Overlay -->
    <div id="errorOverlay" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex justify-center items-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-lg p-6 max-w-sm text-center">
            <i class="fa fa-exclamation-circle text-red-500 text-4xl mb-4"></i>
            <h2 class="text-lg font-semibold">Error</h2>
            <p class="text-sm text-gray-700 mt-2">Es ist ein unerwarteter Fehler aufgetreten.</p>
            <!--
            <button id="closeErrorOverlay" class="mt-4 px-4 py-2 bg-red-500 text-white rounded-md shadow-md hover:bg-red-600">
                Schließen
            </button>
            -->
        </div>
    </div>

</body>

</html>
