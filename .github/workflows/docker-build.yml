name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: false
        default: false
        type: boolean
      save_image:
        description: 'Save image as tar.gz (like --save flag)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build Documentation (Docusaurus)
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: WebDoc/yarn.lock

      - name: Install dependencies
        working-directory: WebDoc
        run: yarn install --frozen-lockfile

      - name: Build documentation
        working-directory: WebDoc
        run: yarn build

      - name: Move documentation to WebApp
        run: |
          rm -rf WebApp/railyWebIndex/wwwroot/documentation || true
          mv WebDoc/build WebApp/railyWebIndex/wwwroot/documentation

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: WebApp/railyWebIndex/wwwroot/documentation
          retention-days: 1

  # Job 2: Build Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-docs
    
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: WebApp/railyWebIndex/wwwroot/documentation

      - name: Read version from file
        id: version
        run: |
          VERSION=$(cat version.txt | tr -d ' \n\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: railhq.io:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Docker image (--save equivalent)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.save_image == 'true'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "Exporting Docker image as railhq.io-$VERSION.tar.gz..."
          docker save railhq.io:latest | gzip > railhq.io-$VERSION.tar.gz
          ls -lh railhq.io-$VERSION.tar.gz
          # Also create latest.tar.gz
          cp railhq.io-$VERSION.tar.gz latest.tar.gz

      - name: Upload Docker image artifact
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.save_image == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.version.outputs.version }}
          path: |
            railhq.io-${{ steps.version.outputs.version }}.tar.gz
            latest.tar.gz
          retention-days: 30

      - name: Push to Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Job 3: Create Release (nur bei Tags)
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ needs.build.outputs.version }}
          path: ./artifacts

      - name: List artifacts
        run: ls -lh ./artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: railhq.io v${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/railhq.io-${{ needs.build.outputs.version }}.tar.gz
          body: |
            ## 🚂 railhq.io v${{ needs.build.outputs.version }}
            
            ### Docker Image
            
            **Option 1: Download & Load from Release**
            ```bash
            # Download railhq.io-${{ needs.build.outputs.version }}.tar.gz, then:
            gunzip -c railhq.io-${{ needs.build.outputs.version }}.tar.gz | docker load
            ```
            
            **Option 2: Pull from GitHub Container Registry**
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}
            # or
            docker pull ghcr.io/${{ github.repository }}:latest
            ```
            
            ### What's Included
            
            - 🌐 **railyWebApp** - Main web application
            - 🔐 **railyWebIndex** - User management and access control
            - 📚 **Documentation** - Built-in Docusaurus documentation
            
            ### Gateway Downloads
            
            For Gateway binaries (Windows, Linux, macOS, Raspberry Pi), see the separate [Gateway Releases](https://github.com/${{ github.repository }}/actions/workflows/build-gateway.yml).
            
            ### Installation
            
            See [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md) for detailed instructions.

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Gateway/railyGateway/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
