<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailHQ – Aktuell technische Schwierigkeiten</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* sanftes Hellgrau */
            color: #111827;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2rem;
            color: #2563eb; /* freundlicher Blauton für Team/Service */
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            max-width: 500px;
        }
        .team {
            font-weight: 600;
            color: #2563eb;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1rem;
            color: #ffffff;
            background-color: #2563eb;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="icon">🛠️</div>
    <h1>RailHQ – Aktuell technische Schwierigkeiten</h1>
    <p>Es kann derzeit zu kleineren Beeinträchtigungen kommen. Unser Technikteam arbeitet daran, alles schnellstmöglich zu beheben.</p>
    <p class="team">Vielen Dank für dein Verständnis!</p>
    <a href="/" class="button">Zur Startseite</a>
</body>
</html>
