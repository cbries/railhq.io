worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Docker interner DNS-Server (optional, falls nötig)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Root für die statische Wartungsseite
    root /usr/share/nginx/html/runtime;
    index maintenance.html;

    # HTTP -> HTTPS Weiterleitung
    server {
        listen 80;
        server_name railhq.io analytics.railhq.io admin.railhq.io;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server für Maintenance
    server {
        listen 443 ssl;
        server_name railhq.io analytics.railhq.io admin.railhq.io;

        ssl_certificate /etc/nginx/certificates/railhq-local.crt;
        ssl_certificate_key /etc/nginx/certificates/railhq-local.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;

        # Alle Requests auf die Maintenance-Seite umleiten
        location / {
            try_files /maintenance.html =502;
        }

        # Optionale Fehlerseiten (falls irgendwas schiefgeht)
        error_page 502 504 /maintenance.html;
    }
}
