worker_processes 1;

events {
    worker_connections 1024;
}

http {

    # Docker interner DNS-Server
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Fehlerseiten für Backends
    root /usr/share/nginx/html;
    index index.html;

    # HTTP-only Server (kein TLS)
    server {
        listen 80;
        server_name railhq.io localhost;

        error_page 502 504 /issues.html;
        location /issues.html {
            root /usr/share/nginx/html/runtime;
            internal;
        }

        # Weiterleitung zu Index (intern auf Port 80)
        location / {
            set $backend "http://index:80";
            proxy_pass $backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}